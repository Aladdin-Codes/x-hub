<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sample Extension</title>
  <style>
    /* ---- Theme: dual-declaration fallbacks (correct light/dark colors without the host) ---- */
    :root {
      color-scheme: light;
      --surface: var(--xhub-surface, rgba(255, 255, 255, 0.66));
      --well: var(--xhub-bg-card, rgba(255, 255, 255, 0.9));
      --ink: var(--xhub-text-1, #1f2230);
      --ink-2: var(--xhub-text-2, #5b6070);
      --line: var(--xhub-border, rgba(0, 0, 0, 0.1));
      --primary: var(--xhub-accent, #5b5bf5);
      --radius: var(--xhub-radius-lg, 12px);
    }
    :root[data-xhub-theme="dark"] {
      color-scheme: dark;
      --surface: var(--xhub-surface, rgba(255, 255, 255, 0.06));
      --well: var(--xhub-bg-card, rgba(255, 255, 255, 0.04));
      --ink: var(--xhub-text-1, #e8e9f0);
      --ink-2: var(--xhub-text-2, #a2a7b8);
      --line: var(--xhub-border, rgba(255, 255, 255, 0.12));
      --primary: var(--xhub-accent, #8b8bff);
    }

    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      /* Full-page padding standard (the host adds no padding to view/window/drawer; this page owns all spacing):
         default: top/left 0, bottom/right 20 — title row sits under the title bar at the same height as the first sidebar icon;
         bottom/right spacing keeps content off the window edges.
         If the user chose "no padding" during generation, use padding: 0. */
      padding: 0 20px 20px 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      /* Rule: use --xhub-page-bg for the page background (no wallpaper = host background; wallpaper = transparent) */
      background: var(--xhub-page-bg, transparent);
      color: var(--ink);
    }

    .panel {
      /* Use the glass token for content surfaces (already includes the host glass-opacity multiplier) */
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    /* Transparent wallpaper mode: remove the white border, keep the shadow, and add a soft black text glow */
    :root[data-xhub-wallpaper-clear="1"] .panel {
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    button {
      font: inherit;
      color: var(--ink);
      background: var(--well);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="panel">
    <h1 id="title" style="margin:0 0 8px;font-size:16px;font-weight:650">Sample Extension</h1>
    <p id="out" style="margin:0 0 12px;color:var(--ink-2)">Loading…</p>
    <button id="act">Run</button>
  </div>

  <script>
    // The host injects the bridge API; don't import any packages.
    const $out = document.getElementById('out')

    // Boot mode: storage is asynchronous. Read saved data before the first render; don't read synchronously at the top level.
    async function boot() {
      let runtime = null
      try {
        // Always use try/catch: show a clear message if permission is denied (PERMISSION_DENIED), not a blank screen.
        runtime = await window.xhub.runtime.info()
        const saved = await window.xhub.storage.get('state')
        $out.textContent = saved
          ? `Saved: ${JSON.stringify(saved)}`
          : `Ready: ${runtime.name} v${runtime.version} (${runtime.runtime})`
      } catch (e) {
        $out.textContent = `${e.code || 'ERROR'}: ${e.message}`
      }
    }

    document.getElementById('act').addEventListener('click', async () => {
      try {
        // Check the available capabilities before writing; use runtime.info().capabilities as the source of truth for uncertain APIs.
        await window.xhub.storage.set('state', { at: Date.now() })
        $out.textContent = 'Saved'
      } catch (e) {
        $out.textContent = `${e.code || 'ERROR'}: ${e.message}`
      }
    })

    boot()
  </script>
</body>
</html>
